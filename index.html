<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XO Game</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="app">
      <section class="game-card">
        <p class="eyebrow">HTML • CSS • JavaScript</p>
        <h1>XO Game</h1>
        <p class="status" aria-live="polite">Player X's turn</p>

        <div class="scoreboard" aria-label="Scoreboard">
          <article class="score">
            <span class="label">Player X</span>
            <strong id="score-x">0</strong>
          </article>
          <article class="score">
            <span class="label">Draws</span>
            <strong id="score-draw">0</strong>
          </article>
          <article class="score">
            <span class="label">Player O</span>
            <strong id="score-o">0</strong>
          </article>
        </div>

        <div class="board" aria-label="Tic tac toe board">
          <button class="cell" type="button" data-cell></button>
          <button class="cell" type="button" data-cell></button>
          <button class="cell" type="button" data-cell></button>
          <button class="cell" type="button" data-cell></button>
          <button class="cell" type="button" data-cell></button>
          <button class="cell" type="button" data-cell></button>
          <button class="cell" type="button" data-cell></button>
          <button class="cell" type="button" data-cell></button>
          <button class="cell" type="button" data-cell></button>
        </div>

        <div class="actions">
          <button class="action-button" type="button" id="reset-round">
            Reset Round
          </button>
          <button class="action-button secondary" type="button" id="new-game">
            New Game
          </button>
        </div>
      </section>
    </main>

    <script src="./js/main.js"></script>
  </body>
</html>
